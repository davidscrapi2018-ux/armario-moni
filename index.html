  <script>
    // Si algo falla, lo muestra en pantalla en vez de quedarse en blanco
    function showErr(m) { var d = document.createElement('pre'); d.className = 'fatal'; d.textContent = 'Error: ' + m; document.body.appendChild(d); }
    window.addEventListener('error', function (e) { showErr(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); });
    window.addEventListener('unhandledrejection', function (e) { showErr(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
